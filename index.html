<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тренировки</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f4f2ed;color:#1c1c1c;font-size:14px}
.header{background:#fff;border-bottom:1px solid #e2ddd5;padding:14px 16px 0;position:sticky;top:0;z-index:10}
.header h1{font-size:17px;font-weight:600;margin-bottom:10px}
.tabs{display:flex;overflow-x:auto}
.tab{background:none;border:none;border-bottom:2px solid transparent;padding:9px 16px;font-size:13px;font-weight:500;color:#999;cursor:pointer;white-space:nowrap}
.tab.on{color:#1c1c1c;border-bottom-color:#1c1c1c}
.main{padding:14px 16px}
.card{background:#fff;border:1px solid #e2ddd5;border-radius:6px;margin-bottom:10px;overflow:hidden}
.card-head{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;gap:8px}
.card-head:active{background:#f5f3ee}
.badge{background:#1c1c1c;color:#fff;font-size:11px;padding:3px 8px;border-radius:3px;white-space:nowrap}
.week-head{padding:12px 14px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;background:#f0ede6;border-bottom:1px solid #e2ddd5}
.week-title{font-size:14px;font-weight:600}
.week-sub{font-size:11px;color:#888;margin-top:2px}
.tbl-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{border-collapse:collapse;font-size:13px;width:max-content;min-width:100%}
th{text-align:left;padding:8px 12px;font-size:11px;font-weight:600;text-transform:uppercase;color:#aaa;border-bottom:1px solid #e2ddd5;background:#f9f8f5;white-space:nowrap}
td{padding:8px 12px;border-bottom:1px solid #f0ece4;vertical-align:top}
td.ex{font-weight:500;min-width:160px}
td.muscle{min-width:90px}
td.wt{min-width:100px;white-space:nowrap}
td.sets{min-width:60px;white-space:nowrap}
td.reps{min-width:80px;white-space:nowrap}
td.note{min-width:180px;color:#aaa;font-style:italic;font-size:12px}
td.copy-cell{width:36px;text-align:center}
.mtag{display:inline-block;font-size:9px;font-weight:600;text-transform:uppercase;padding:2px 6px;border-radius:2px;background:#e2ddd5;color:#777;white-space:nowrap}
.btn{border:none;border-radius:4px;padding:7px 12px;font-size:13px;font-weight:500;cursor:pointer;font-family:inherit;white-space:nowrap}
.btn-dark{background:#1c1c1c;color:#fff}
.btn-outline{background:none;border:1px solid #ccc;color:#555}
.btn-yellow{background:#fffbf0;border:1px solid #e6c84a;color:#7a5c00}
.btn-green{background:#e8f5e0;border:1px solid #a8d878;color:#3a6a10}
.btn-blue{background:#e8f0fe;border:1px solid #93b4f5;color:#1a56db}
.btn-copy{background:none;border:none;color:#bbb;font-size:15px;cursor:pointer;padding:2px 4px}
.btn-copy:active{color:#1a56db}
input,select,textarea{font-family:inherit;font-size:13px;color:#1c1c1c;background:#fff;border:1px solid #ddd;border-radius:4px;padding:6px 9px;width:100%}
input:focus,select:focus,textarea:focus{border-color:#1c1c1c;outline:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}
.field{display:flex;flex-direction:column;gap:4px}
.label{font-size:10px;font-weight:600;text-transform:uppercase;color:#aaa;letter-spacing:.05em}
.flash{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:#1c1c1c;color:#fff;padding:9px 18px;border-radius:4px;font-size:13px;z-index:100;display:none;white-space:nowrap}
.empty{text-align:center;color:#bbb;padding:50px 0;font-size:13px}
.inp-row td{padding:5px 6px;background:#fafaf7;vertical-align:middle}
.inp-row td input{font-size:13px;padding:6px 8px;min-width:60px}
.inp-row td.ex-inp input{min-width:180px}
.inp-row td.note-inp input{min-width:220px}
.inp-row td.muscle-inp input{min-width:100px}
.del{background:none;border:none;color:#ccc;font-size:14px;cursor:pointer;padding:2px 5px}
.actions{display:flex;gap:5px;flex-wrap:wrap;flex-shrink:0}
.edit-bar{padding:10px 14px;background:#fffbf0;border-top:1px solid #e6c84a;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
</style>
</head>
<body>
<div class="flash" id="flash"></div>
<div class="header">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
    <h1>💪 Тренировки</h1>
    <button class="btn btn-green" onclick="doExport()" style="font-size:12px;padding:6px 10px">📋 Для Claude</button>
  </div>
  <div class="tabs">
    <button class="tab on" id="t-history" onclick="show('history')">История</button>
    <button class="tab" id="t-weeks" onclick="show('weeks')">По неделям</button>
    <button class="tab" id="t-new" onclick="show('new')">+ Новая</button>
    <button class="tab" id="t-import" onclick="show('import')">⬇ От Claude</button>
  </div>
</div>
<div class="main">
  <div id="p-history"></div>
  <div id="p-weeks" style="display:none"></div>
  <div id="p-new" style="display:none"></div>
  <div id="p-import" style="display:none"></div>
</div>
<script>
const KEY='wlog-v4';
const WT=['Full Body','Грудь + Трицепс','Спина + Бицепс','Ноги','Плечи','Другое'];
let W=[],openId=null,editId=null,eRows=[],eDate='',eType='',openWeeks=new Set();

const PRE=[
  {id:1746700000001,date:'2026-05-12',type:'Грудь + Трицепс',rows:[
    {muscle:'Грудь',exercise:'Жим лёжа',weight:'50/60/65',sets:'4',reps:'10/8/5/5',note:'Все рабочие'},
    {muscle:'Грудь',exercise:'Жим в тренажере в наклоне',weight:'40',sets:'4',reps:'8',note:'+2 читинг в каждом подходе'},
    {muscle:'Плечи',exercise:'Подъём блина вперёд',weight:'10',sets:'4',reps:'10',note:''},
    {muscle:'Плечи',exercise:'Махи в наклоне',weight:'6',sets:'3',reps:'8',note:''},
    {muscle:'Кор',exercise:'Скручивания',weight:'—',sets:'3',reps:'10',note:''},
  ]},
  {id:1746614400000,date:'2026-05-11',type:'Спина + Бицепс',rows:[
    {muscle:'Спина',exercise:'Тяга в наклоне',weight:'55/50',sets:'3',reps:'10/10/10',note:'Последние 2 пол амплитуды'},
    {muscle:'Спина',exercise:'Румынская тяга',weight:'50',sets:'2',reps:'12/10',note:'Боль в пояснице'},
    {muscle:'Спина',exercise:'Горизонтальная тяга одной рукой',weight:'20/22.5/23.75',sets:'3',reps:'12/10/8',note:'+2 читинг последний'},
    {muscle:'Спина',exercise:'Вертикальная тяга',weight:'40',sets:'2',reps:'10',note:'Краб, широкий хват'},
    {muscle:'Бицепс',exercise:'Штанга на бицепс',weight:'7.5',sets:'4',reps:'5+5',note:'Обратный + обычный'},
    {muscle:'Плечи',exercise:'Задние дельты тренажер',weight:'35',sets:'3',reps:'10',note:''},
    {muscle:'Кор',exercise:'Скручивания с весом',weight:'10/15',sets:'3',reps:'10/8/8',note:'Разм: б/в'},
  ]},
  {id:1746000000000,date:'2026-05-07',type:'Full Body',rows:[
    {muscle:'Full Body',exercise:'Отжимания (гравитрон)',weight:'40',sets:'4',reps:'10',note:''},
    {muscle:'Full Body',exercise:'Подтягивания (гравитрон)',weight:'40',sets:'4',reps:'8',note:''},
    {muscle:'Грудь',exercise:'Пуловер с гантелью',weight:'22',sets:'3',reps:'6-8',note:'Тяжеловато, пол амплитуды'},
    {muscle:'Плечи',exercise:'Разводка на плечи',weight:'10',sets:'4',reps:'6',note:''},
    {muscle:'Плечи',exercise:'Face pull',weight:'40',sets:'3',reps:'10',note:''},
    {muscle:'Трицепс',exercise:'Трицепс с канатом',weight:'30',sets:'3',reps:'12',note:'Последний 35кг×12'},
    {muscle:'Кор',exercise:'Скручивания на тренажере',weight:'10',sets:'3',reps:'10',note:''},
    {muscle:'Ноги',exercise:'Приседания плие',weight:'10',sets:'3',reps:'10',note:''},
    {muscle:'Кор',exercise:'Птица-собака',weight:'—',sets:'2',reps:'12',note:''},
  ]}
];

function load(){
  try{
    const s=localStorage.getItem(KEY);
    if(s){
      const p=JSON.parse(s);
      const ids=new Set(p.map(x=>x.id));
      W=[...PRE.filter(x=>!ids.has(x.id)),...p].sort((a,b)=>new Date(b.date)-new Date(a.date));
    } else { W=[...PRE]; }
  } catch(e){ W=[...PRE]; }
  save(); render();
}

function save(){ try{localStorage.setItem(KEY,JSON.stringify(W));}catch(e){} }

function flash(msg){
  const el=document.getElementById('flash');
  el.textContent=msg; el.style.display='block';
  setTimeout(()=>el.style.display='none',2500);
}

function fmtDate(d){
  return new Date(d+'T12:00:00').toLocaleDateString('ru-RU',{weekday:'short',day:'numeric',month:'long'});
}

function wkKey(d){
  const dt=new Date(d),dy=dt.getDay()||7;
  const m=new Date(dt); m.setDate(dt.getDate()-(dy-1));
  return m.toISOString().split('T')[0];
}

function wkNum(d){
  const dt=new Date(d+'T12:00:00');
  const jan4=new Date(dt.getFullYear(),0,4);
  const w1=new Date(jan4); w1.setDate(jan4.getDate()-(jan4.getDay()||7)+1);
  return Math.ceil((dt-w1)/(7*86400000))+1;
}

function wkLabel(d){
  const dt=new Date(d),dy=dt.getDay()||7;
  const m=new Date(dt); m.setDate(dt.getDate()-(dy-1));
  const s=new Date(m); s.setDate(m.getDate()+6);
  const f=x=>x.toLocaleDateString('ru-RU',{day:'numeric',month:'short'});
  return f(m)+' – '+f(s);
}

function wtSel(id,val){
  return '<select id="'+id+'" style="font-size:13px;width:auto">'+WT.map(t=>'<option'+(t===val?' selected':'')+'>'+t+'</option>').join('')+'</select>';
}

function tableHead(withCopy){
  return '<div class="tbl-wrap"><table><thead><tr>'
    +'<th>Группа</th><th>Упражнение</th><th>Вес</th><th>Подх.</th><th>Повт.</th><th>Комментарий</th>'
    +(withCopy?'<th></th>':'')
    +'</tr></thead>';
}

function viewRows(rows,wId){
  return rows.map((r,i)=>'<tr>'
    +'<td class="muscle"><span class="mtag">'+r.muscle+'</span></td>'
    +'<td class="ex">'+r.exercise+'</td>'
    +'<td class="wt">'+r.weight+(r.weight&&r.weight!=='—'?' кг':'')+'</td>'
    +'<td class="sets">'+r.sets+'</td>'
    +'<td class="reps">'+r.reps+'</td>'
    +'<td class="note">'+r.note+'</td>'
    +(wId!==undefined?'<td class="copy-cell"><button class="btn-copy" onclick="copyEx('+wId+','+i+')" title="Скопировать">📋</button></td>':'')
    +'</tr>').join('');
}

function closeTable(){ return '</table></div>'; }

function copyEx(wId,rowIdx){
  const w=W.find(x=>x.id===wId); if(!w) return;
  const r=w.rows[rowIdx];
  const txt=r.exercise+': '+r.weight+'кг, '+r.sets+' подх, '+r.reps+' повт'+(r.note?' ('+r.note+')':'');
  navigator.clipboard.writeText(txt)
    .then(()=>flash('Упражнение скопировано ✓'))
    .catch(()=>flash('Ошибка'));
}

function copyWorkout(id){
  const w=W.find(x=>x.id===id); if(!w) return;
  const lines=['📅 '+fmtDate(w.date)+' — '+w.type];
  w.rows.forEach(r=>{
    let s='  • '+(r.muscle?'['+r.muscle+'] ':'')+r.exercise;
    if(r.weight&&r.weight!=='—') s+=' — '+r.weight+'кг';
    if(r.sets) s+=', '+r.sets+' подх';
    if(r.reps) s+=' × '+r.reps;
    if(r.note) s+=' ('+r.note+')';
    lines.push(s);
  });
  navigator.clipboard.writeText(lines.join('\n'))
    .then(()=>flash('Тренировка скопирована ✓'))
    .catch(()=>flash('Ошибка'));
}

function show(tab){
  ['history','weeks','new','import'].forEach(t=>{
    document.getElementById('p-'+t).style.display=t===tab?'':'none';
    document.getElementById('t-'+t).classList.toggle('on',t===tab);
  });
  if(tab==='history') renderHistory();
  if(tab==='weeks') renderWeeks();
  if(tab==='new') renderNew();
  if(tab==='import') renderImport();
}

function render(){ renderHistory(); }

function editRowHtml(r,i){
  return '<tr class="inp-row">'
    +'<td class="muscle-inp"><input value="'+r.muscle+'" oninput="updER('+i+',\'muscle\',this.value)" placeholder="Группа"></td>'
    +'<td class="ex-inp"><input value="'+r.exercise+'" oninput="updER('+i+',\'exercise\',this.value)" placeholder="Упражнение"></td>'
    +'<td><input value="'+r.weight+'" oninput="updER('+i+',\'weight\',this.value)" placeholder="80кг" style="min-width:80px"></td>'
    +'<td><input value="'+r.sets+'" oninput="updER('+i+',\'sets\',this.value)" placeholder="3" style="min-width:50px"></td>'
    +'<td><input value="'+r.reps+'" oninput="updER('+i+',\'reps\',this.value)" placeholder="8" style="min-width:60px"></td>'
    +'<td class="note-inp"><input value="'+r.note+'" oninput="updER('+i+',\'note\',this.value)" placeholder="Заметка"></td>'
    +'<td><button class="del" onclick="removeER('+i+')">✕</button></td>'
    +'</tr>';
}

function renderHistory(){
  const el=document.getElementById('p-history');
  if(!W.length){el.innerHTML='<div class="empty">Нет тренировок. Нажми «+ Новая».</div>';return;}
  el.innerHTML=W.map(w=>{
    const isOpen=openId===w.id;
    const isEdit=editId===w.id;
    let body='';
    if(isEdit){
      body='<div class="tbl-wrap"><table><thead><tr>'
        +'<th>Группа</th><th>Упражнение</th><th>Вес</th><th>Подх.</th><th>Повт.</th><th>Комментарий</th><th></th>'
        +'</tr></thead><tbody id="etb">'+eRows.map((r,i)=>editRowHtml(r,i)).join('')+'</tbody></table></div>'
        +'<div class="edit-bar">'
        +'<input type="date" id="ed" value="'+eDate+'" style="width:auto">'
        +wtSel('et',eType)
        +'<button class="btn btn-outline" onclick="addER()" style="font-size:12px">+ Строка</button>'
        +'<button class="btn btn-dark" onclick="saveEdit('+w.id+')" style="font-size:12px">Сохранить</button>'
        +'<button class="btn btn-outline" onclick="cancelEdit()" style="font-size:12px">Отмена</button>'
        +'</div>';
    } else if(isOpen){
      body=tableHead(true)+'<tbody>'+viewRows(w.rows,w.id)+'</tbody>'+closeTable();
    }
    return '<div class="card">'
      +'<div class="card-head" onclick="toggleCard('+w.id+')">'
      +'<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-width:0">'
      +'<span class="badge">'+fmtDate(w.date)+'</span>'
      +'<span style="font-size:12px;color:#888">'+w.type+'</span>'
      +'<span style="font-size:11px;color:#ccc">'+w.rows.length+' упр.</span>'
      +'</div>'
      +'<div class="actions" onclick="event.stopPropagation()">'
      +'<button class="btn btn-blue" style="font-size:11px;padding:4px 8px" onclick="copyWorkout('+w.id+')">📋</button>'
      +'<button class="btn btn-yellow" style="font-size:11px;padding:4px 8px" onclick="startEdit('+w.id+')">Изменить</button>'
      +'<button class="btn btn-outline" style="font-size:11px;padding:4px 8px" onclick="delW('+w.id+')">Удалить</button>'
      +'</div>'
      +'</div>'+body+'</div>';
  }).join('');
}

function toggleCard(id){ openId=openId===id?null:id; renderHistory(); }

function startEdit(id){
  const w=W.find(x=>x.id===id);
  editId=id; eRows=w.rows.map(r=>({...r})); eDate=w.date; eType=w.type; openId=id;
  renderHistory();
}
function cancelEdit(){ editId=null; eRows=[]; renderHistory(); }
function updER(i,f,v){ eRows[i][f]=v; }
function addER(){
  eRows.push({muscle:'',exercise:'',weight:'',sets:'',reps:'',note:''});
  const tb=document.getElementById('etb');
  if(tb) tb.innerHTML=eRows.map((r,i)=>editRowHtml(r,i)).join('');
}
function removeER(i){
  eRows.splice(i,1);
  const tb=document.getElementById('etb');
  if(tb) tb.innerHTML=eRows.map((r,i)=>editRowHtml(r,i)).join('');
}
function saveEdit(id){
  const d=document.getElementById('ed').value;
  const t=document.getElementById('et').value;
  const filled=eRows.filter(r=>r.exercise.trim());
  if(!filled.length){flash('Добавь хотя бы одно упражнение');return;}
  W=W.map(w=>w.id===id?{...w,date:d||w.date,type:t,rows:filled}:w)
    .sort((a,b)=>new Date(b.date)-new Date(a.date));
  editId=null; eRows=[]; save(); renderHistory(); flash('Сохранено ✓');
}
function delW(id){ if(!confirm('Удалить?'))return; W=W.filter(w=>w.id!==id); save(); renderHistory(); }

function toggleWeek(key){
  if(openWeeks.has(key)) openWeeks.delete(key);
  else openWeeks.add(key);
  renderWeeks();
}

function renderWeeks(){
  const el=document.getElementById('p-weeks');
  const wks=[...new Set(W.map(w=>wkKey(w.date)))].sort((a,b)=>b.localeCompare(a));
  if(!wks.length){el.innerHTML='<div class="empty">Нет тренировок</div>';return;}
  el.innerHTML=wks.map(key=>{
    const wws=W.filter(w=>wkKey(w.date)===key);
    const isOpen=openWeeks.has(key);
    const num=wkNum(key);
    const year=new Date(key+'T12:00:00').getFullYear();
    let body='';
    if(isOpen){
      body=wws.map(w=>'<div style="border-top:1px solid #e2ddd5;padding:12px 14px">'
        +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px">'
        +'<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">'
        +'<span class="badge">'+fmtDate(w.date)+'</span>'
        +'<span style="font-size:12px;color:#888">'+w.type+'</span>'
        +'</div>'
        +'<button class="btn btn-blue" style="font-size:11px;padding:4px 9px;flex-shrink:0" onclick="copyWorkout('+w.id+')">📋</button>'
        +'</div>'
        +tableHead(true)+'<tbody>'+viewRows(w.rows,w.id)+'</tbody>'+closeTable()
        +'</div>').join('');
    }
    return '<div class="card">'
      +'<div class="week-head" onclick="toggleWeek(\''+key+'\')"><div>'
      +'<div class="week-title">Неделя '+num+' · '+year+'</div>'
      +'<div class="week-sub">'+wkLabel(key)+' · '+wws.length+' тр.</div>'
      +'</div><span style="color:#bbb;font-size:12px">'+(isOpen?'▲':'▼')+'</span></div>'
      +body+'</div>';
  }).join('');
}

function newRowHtml(){
  return '<tr class="inp-row">'
    +'<td class="muscle-inp"><input placeholder="Группа"></td>'
    +'<td class="ex-inp"><input placeholder="Упражнение"></td>'
    +'<td><input placeholder="80кг" style="min-width:80px"></td>'
    +'<td><input placeholder="3" style="min-width:50px"></td>'
    +'<td><input placeholder="8" style="min-width:60px"></td>'
    +'<td class="note-inp"><input placeholder="Заметка"></td>'
    +'<td><button class="del" onclick="this.closest(\'tr\').remove()">✕</button></td>'
    +'</tr>';
}

function renderNew(){
  const today=new Date().toISOString().split('T')[0];
  document.getElementById('p-new').innerHTML=
    '<div class="card" style="padding:14px">'
    +'<div class="row">'
    +'<div class="field"><span class="label">Дата</span><input type="date" id="nd" value="'+today+'" style="width:auto"></div>'
    +'<div class="field"><span class="label">Тип</span>'+wtSel('nt','Full Body')+'</div>'
    +'</div>'
    +'<div class="tbl-wrap" style="border:1px solid #e2ddd5;border-radius:4px;margin-bottom:10px">'
    +'<table><thead><tr><th>Группа</th><th>Упражнение</th><th>Вес</th><th>Подх.</th><th>Повт.</th><th>Комментарий</th><th></th></tr></thead>'
    +'<tbody id="ntb">'+newRowHtml()+'</tbody></table></div>'
    +'<div style="display:flex;gap:8px">'
    +'<button class="btn btn-outline" onclick="addNR()">+ Строка</button>'
    +'<button class="btn btn-dark" onclick="saveNew()">Сохранить</button>'
    +'</div></div>';
}

function addNR(){
  const tb=document.getElementById('ntb');
  const tr=document.createElement('tr'); tr.className='inp-row';
  tr.innerHTML=newRowHtml().replace(/<tr[^>]*>/,'').replace('</tr>','');
  tb.appendChild(tr);
}

function saveNew(){
  const date=document.getElementById('nd').value;
  const type=document.getElementById('nt').value;
  const rows=[];
  document.querySelectorAll('#ntb tr').forEach(tr=>{
    const ins=tr.querySelectorAll('input');
    const ex=ins[1].value.trim();
    if(!ex) return;
    rows.push({muscle:ins[0].value,exercise:ex,weight:ins[2].value,sets:ins[3].value,reps:ins[4].value,note:ins[5].value});
  });
  if(!rows.length){flash('Добавь хотя бы одно упражнение');return;}
  const w={id:Date.now(),date,type,rows};
  W=[w,...W].sort((a,b)=>new Date(b.date)-new Date(a.date));
  openId=w.id; save(); show('history'); flash('Тренировка сохранена ✓');
}

function renderImport(){
  const today=new Date().toISOString().split('T')[0];
  document.getElementById('p-import').innerHTML=
    '<div class="card" style="padding:14px">'
    +'<p style="font-size:12px;color:#666;margin-bottom:12px;line-height:1.6">Скажи Claude «запиши в таблицу» → скопируй таблицу → вставь сюда → нажми «Импортировать».</p>'
    +'<div class="row">'
    +'<div class="field"><span class="label">Дата</span><input type="date" id="id" value="'+today+'" style="width:auto"></div>'
    +'<div class="field"><span class="label">Тип</span>'+wtSel('it','Full Body')+'</div>'
    +'</div>'
    +'<textarea id="itxt" rows="8" placeholder="| Группа | Упражнение | Вес | Подх. | Повт. | Комментарий |" style="margin-bottom:10px;font-family:monospace;font-size:11px"></textarea>'
    +'<div style="display:flex;gap:8px">'
    +'<button class="btn btn-dark" onclick="doImport()">Импортировать</button>'
    +'<button class="btn btn-outline" onclick="document.getElementById(\'itxt\').value=\'\'">Очистить</button>'
    +'</div></div>';
}

function doImport(){
  const txt=document.getElementById('itxt').value;
  const date=document.getElementById('id').value;
  const type=document.getElementById('it').value;
  if(!txt.trim()){flash('Вставь таблицу');return;}
  const rows=[];
  txt.split('\n').forEach(line=>{
    if(!line.startsWith('|')||line.includes('---')||line.toLowerCase().includes('группа'))return;
    const cells=line.split('|').map(c=>c.trim()).filter((_,i,a)=>i>0&&i<a.length-1);
    if(cells.length<5)return;
    const [muscle,exercise,weight,sets,reps,...np]=cells;
    rows.push({muscle,exercise,weight:weight.replace(/кг/gi,'').trim(),sets,reps,note:np.join('|').trim()});
  });
  if(!rows.length){flash('Не удалось распознать формат');return;}
  const w={id:Date.now(),date,type,rows};
  W=[w,...W].sort((a,b)=>new Date(b.date)-new Date(a.date));
  openId=w.id; save(); show('history'); flash('Импортировано '+rows.length+' упражнений ✓');
}

function doExport(){
  if(!W.length){flash('Нет данных');return;}
  const lastKey=wkKey(W[0].date);
  const lastWeek=W.filter(w=>wkKey(w.date)===lastKey);
  const num=wkNum(lastKey);
  const lines=['=== НЕДЕЛЯ '+num+' ('+wkLabel(lastKey)+') ===\n'];
  lastWeek.forEach(w=>{
    lines.push('📅 '+fmtDate(w.date)+' — '+w.type);
    w.rows.forEach(r=>{
      let s='  • '+(r.muscle?'['+r.muscle+'] ':'')+r.exercise;
      if(r.weight&&r.weight!=='—') s+=' — '+r.weight+'кг';
      if(r.sets) s+=', '+r.sets+' подх';
      if(r.reps) s+=' × '+r.reps;
      if(r.note) s+=' ('+r.note+')';
      lines.push(s);
    });
    lines.push('');
  });
  lines.push('=== КОНЕЦ ===');
  navigator.clipboard.writeText(lines.join('\n'))
    .then(()=>flash('Последняя неделя скопирована ✓'))
    .catch(()=>flash('Ошибка копирования'));
}

load();
</script>
